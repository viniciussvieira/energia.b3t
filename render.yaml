# Blueprint do Render: cria a API do Kanvira automaticamente a partir do GitHub.
services:
  - type: web
    name: kanvira-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false # você cola a connection string do Neon no painel do Render
      - key: KANVIRA_SECRET
        generateValue: true # chave secreta dos tokens de login, gerada pelo Render
